<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Construct Lab</title><link rel="preconnect" href="https://cdn.jsdelivr.net"><link rel="stylesheet" href="styles.css"></head><body><div id="game-root"></div><div id="hud"><div id="topbar"><div class="brand">CONSTRUCT LAB</div><div id="mode-pill">BUILD MODE</div></div><div id="crosshair">+</div><div id="help-panel"><strong>Controls</strong><br>WASD move / drive<br>Mouse look · Space jump<br>E seat · Tab mode<br>LMB place · RMB remove<br>R rotate · 1-9 parts<br>K save · O load · F1 settings</div><div id="toolbar"></div><div id="status-bar">Loading…</div></div><div id="toast"></div><div id="settings-panel" class="hidden"><div class="panel-header"><h2>Settings</h2><button id="close-settings">Close</button></div><label>Mouse Sensitivity<input id="sensitivity" type="range" min=".001" max=".008" step=".0002" value=".0026"></label><label>Gravity<input id="gravity" type="range" min="-18" max="-3" step=".5" value="-9.81"></label><label>Building Snap<select id="snap-mode"><option value="1">1 Unit</option><option value="2">2 Units</option></select></label></div><script type="module" src="script.js"></script></body></html>
